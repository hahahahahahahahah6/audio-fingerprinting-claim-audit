[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-fingerprinting-claim-audit"
version = "0.1.0"
description = "Offline static documentation audit"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
audio-fingerprinting-claim-audit = "audio_fingerprinting_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["audio_fingerprinting_claim_audit*", "tests"]
